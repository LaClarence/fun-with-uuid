name: Publish

# Publishes the jars to GitHub Packages when a GitHub Release is published.
# The version comes from the release tag: v0.6 or 0.6 publishes version 0.6.
on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Writes ~/.m2/settings.xml with a server "github" that reads GITHUB_ACTOR / GITHUB_TOKEN
      - name: Set up JDK 27
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '27'
          cache: maven
          server-id: github

      - name: Set version from release tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            echo "::error::Release tag '$GITHUB_REF_NAME' must look like v0.6 or 0.6"
            exit 1
          fi
          mvn -B -ntp org.codehaus.mojo:versions-maven-plugin:2.23.0:set \
              -DnewVersion="$version" -DgenerateBackupPoms=false

      - name: Build, test and publish
        run: mvn -B -ntp deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
